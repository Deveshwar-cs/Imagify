<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Imagify Screenshot</title>

    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="container">
      <!-- Header -->

      <div class="header">
        <h1>Imagify</h1>

        <p>Screenshot Tool</p>
      </div>

      <!-- Actions -->

      <div class="actions">
        <button id="captureView">📷 Capture View</button>

        <button id="captureFullPage">📄 Capture Full Page</button>
      </div>

      <!-- Status -->

      <div id="status" class="status"></div>

      <!-- Screenshot Preview -->

      <div id="previewContainer" class="preview-container"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
