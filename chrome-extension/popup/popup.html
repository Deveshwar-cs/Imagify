<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Imagify Screenshot</title>

    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="container">
      <!-- Header -->

      <div class="header">
        <h1>Imagify</h1>

        <p>Screenshot Tool</p>
      </div>

      <!-- Capture Actions -->

      <div class="actions">
        <button id="captureView">Capture View</button>

        <button id="captureFullPage">Capture Full Page</button>
      </div>

      <!-- Status -->

      <div id="status" class="status"></div>

      <!-- Preview -->

      <div id="previewContainer" class="preview-container">
        <img
          id="screenshotPreview"
          class="screenshot-preview hidden"
          alt="Screenshot preview"
        />
      </div>

      <!-- Upload -->

      <div id="uploadSection" class="upload-section hidden">
        <button id="uploadButton" class="upload-button">
          ☁️ Send to Imagify
        </button>
      </div>

      <!-- Share Result -->

      <div id="shareSection" class="share-section hidden">
        <p class="share-title">Screenshot shared successfully!</p>

        <input id="shareUrl" type="text" readonly />

        <button id="copyUrlButton" class="copy-button">Copy URL</button>

        <button id="openUrlButton" class="open-button">Open URL</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
